services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusops
      POSTGRES_USER: nexusops
      POSTGRES_PASSWORD: nexusops_dev_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusops -d nexusops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: nexusops-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexusops
      SPRING_DATASOURCE_USERNAME: nexusops
      SPRING_DATASOURCE_PASSWORD: nexusops_dev_secret_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      NEXUSOPS_JWT_SECRET: c3VwZXJfc2VjcmV0X2tleV9mb3JfbmV4dXNvcHNfbXZwXzIwMjZfZGVwbG95bWVudCEhIQ==
      NEXUSOPS_AI_PROVIDER: 9ROUTER
      NEXUSOPS_AI_BASE_URL: http://192.168.68.117:20128/v1
      NEXUSOPS_AI_API_KEY: sk-d4561a4c0bccdb42-oubwfa-e4ea86bf
      NEXUSOPS_AI_MODEL: ag/gemini-3.8-flash
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: nexusops-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.68.117:8080/api
      NEXT_PUBLIC_WS_URL: ws://192.168.68.117:8080/ws
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
